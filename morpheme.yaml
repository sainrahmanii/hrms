# Morpheme CLI Configuration
# This file contains all the configuration needed for Morpheme CLI commands
# Learn more: https://github.com/morphemedesign/morpheme-flutter-cli

# Flavor configurations for different build environments
flavor:
  dev:
    FLAVOR: dev
    APP_NAME: Morpheme Dev
    ANDROID_APPLICATION_ID: design.morpheme.dev
    IOS_APPLICATION_ID: design.morpheme.dev
    BASE_URL: https://reqres.in/api
  stag:
    FLAVOR: stag
    APP_NAME: Morpheme Stag
    ANDROID_APPLICATION_ID: design.morpheme.stag
    IOS_APPLICATION_ID: design.morpheme.stag
    BASE_URL: https://reqres.in/api
  prod:
    FLAVOR: prod
    APP_NAME: Morpheme
    ANDROID_APPLICATION_ID: design.morpheme
    IOS_APPLICATION_ID: design.morpheme
    BASE_URL: https://reqres.in/api

# Firebase configuration (uncomment and configure when needed)
